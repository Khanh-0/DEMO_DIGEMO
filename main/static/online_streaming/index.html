<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Streaming Pilot</title><style>body{font:15px system-ui;margin:0;color:#17202a;background:#fff}main{max-width:1000px;margin:40px auto;padding:0 20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{background:#1769e8;color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:700}video{width:100%;margin-top:20px;background:#111;border-radius:8px}.video-stage{position:relative;margin-top:20px}.video-stage video{display:block;margin-top:0}.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.track-label{font-size:12px;font-weight:700}.status{color:#667085}.warn{color:#9a6700}.watermark{margin-top:15px;height:10px;background:#e8eef7;border-radius:8px;overflow:hidden}.watermark i{display:block;height:100%;background:#1769e8;width:0}</style></head><body><main><h1>Online Streaming Playback-Gated Pilot</h1><p>Video source tá»« backend. Video chá»‰ cháº¡y tá»›i watermark Ä‘Ã£ Ä‘Æ°á»£c xá»­ lÃ½.</p><div class="row"><input id="file" type="file" accept="video/*,.avi,.mkv"><button id="start">Upload & cháº¡y</button></div><p id="status" class="status">ChÆ°a Chọn video.</p><div class="video-stage"><video id="video" controls playsinline></video><canvas id="overlay" class="overlay"></canvas></div><div class="watermark"><i id="bar"></i></div></main><script>const $=x=>document.getElementById(x);let id=null,timer=null,gate=false,tracks=[];function schedule(){clearTimeout(timer);timer=setTimeout(poll,300)}$('start').onclick=async()=>{const f=$('file').files[0];if(!f)return;$('start').disabled=true;const fd=new FormData();fd.append('video',f);const r=await fetch('/api/online-stream/upload',{method:'POST',body:fd}),d=await r.json();if(!r.ok){$('status').textContent=d.error;return}id=d.job_id;poll()};async function poll(){if(!id)return;try{const r=await fetch('/api/online-stream/status/'+id),d=await r.json();if(!r.ok)throw Error(d.error||'status failed');if(d.status==='error')throw Error(d.error);$('status').textContent=`${d.status} Â· ${Number(d.processed_until||0).toFixed(2)}s / ${Number(d.total_duration||0).toFixed(2)}s`;if(d.video_ready&&$('video').dataset.job!==id){$('video').dataset.job=id;$('video').src=d.video_url||'/api/online-stream/video/'+id;$('video').load();$('video').play().catch(()=>{})}const duration=Number(d.total_duration||0);$('bar').style.width=duration?`${Math.min(100,Number(d.processed_until||0)/duration*100)}%`:'0%';if(d.status==='processing'&&gate){const limit=Math.max(0,Number(d.processed_until||0)-margin);if($('video').currentTime>limit)$('video').pause();if($('video').paused&&$('video').currentTime<limit-.1)$('video').play().catch(()=>{})}if(d.status!=='done')schedule();}catch(e){$('status').textContent=e.message;$('status').className='status warn';clearTimeout(timer)}}$('video').addEventListener('timeupdate',()=>{if(!id||!gate)return});</script></body></html>
